<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="msvalidate.01" content="00F65834AB5653D3466CED1E8386FDB7" />
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTDXNZN78T"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-FTDXNZN78T');
			gtag('config', 'AW-17970075651');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	<script>
		// Load Ivory AI chatbot with locale-aware language
		setTimeout(function() {
			if (document.getElementById('ivory-widget')) return;
			var lang = document.documentElement.lang || 'en';
			var s = document.createElement('script');
			s.src = 'https://ivoryai.net/widget/ivory.js';
			s.setAttribute('data-practice-id', '52');
			if (lang === 'tr') s.setAttribute('data-lang', 'tr');
			s.async = true;
			document.body.appendChild(s);
		}, 1000);
	</script>
	<script>
		// Track WhatsApp clicks as Google Ads conversions
		document.addEventListener('click', function(e) {
			var link = e.target.closest('a[href*="wa.me"]');
			if (link && typeof gtag === 'function') {
				gtag('event', 'ads_conversion_Contact_Us_1', {
					'event_timeout': 2000
				});
				gtag('event', 'whatsapp_click', {
					'event_category': 'conversion',
					'event_label': link.href
				});
			}
		});
	</script>
	<script>
		// Micro-conversion tracking for Google Ads optimization.
		// Each event is gated with sessionStorage so it fires AT MOST ONCE per
		// session (across all SPA navs and reloads in the same tab session).
		// Without this, every reload re-fires and inflates conversion counts.
		(function() {
			var SESSION_KEYS = {
				pricing: 'mc_pricing_view_fired',
				contact: 'mc_contact_view_fired',
				engaged: 'mc_engaged_90s_fired'
			};
			function fireOnce(sessionKey, eventName) {
				try {
					if (sessionStorage.getItem(sessionKey)) return;
					if (typeof gtag !== 'function') return;
					gtag('event', eventName, { event_category: 'micro_conversion' });
					sessionStorage.setItem(sessionKey, '1');
				} catch (_) {
					// sessionStorage may throw in private browsing on iOS — fall through.
				}
			}

			// 1. Pricing section viewed — observe whenever a .pricing-section
			// element is in the DOM. Re-checks on SPA navigation via MutationObserver
			// so the event fires regardless of which page mounts the section first.
			var pricingObserver = new IntersectionObserver(function(entries) {
				entries.forEach(function(entry) {
					if (entry.isIntersecting) {
						fireOnce(SESSION_KEYS.pricing, 'pricing_section_view');
						pricingObserver.disconnect();
					}
				});
			}, { threshold: 0.5 });
			function observePricing() {
				if (sessionStorage.getItem(SESSION_KEYS.pricing)) return;
				var el = document.querySelector('.pricing-section');
				if (el) pricingObserver.observe(el);
			}
			document.addEventListener('DOMContentLoaded', observePricing);
			// Re-observe on SPA route changes (SvelteKit dispatches this).
			window.addEventListener('sveltekit:navigation-end', observePricing);

			// 2. Contact page viewed. Check on initial load AND on every SPA nav
			// (DOMContentLoaded only fires once per full reload).
			function checkContactPage() {
				var p = window.location.pathname;
				if (p.indexOf('/contact') !== -1 || p.indexOf('/iletisim') !== -1) {
					fireOnce(SESSION_KEYS.contact, 'contact_page_view');
				}
			}
			checkContactPage();
			window.addEventListener('sveltekit:navigation-end', checkContactPage);

			// 3. Engaged session — fires once after 90s of session lifetime,
			// regardless of how many SPA navs happened. Single-shot via sessionStorage.
			setTimeout(function() {
				fireOnce(SESSION_KEYS.engaged, 'engaged_session_90s');
			}, 90000);
		})();
	</script>
	</body>
</html>
